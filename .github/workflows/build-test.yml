name: Build Test Project

on:
  push:

jobs:
  build:
    name: Build EuroScopeDataBridge.TestProject (WPF)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build tests/EuroScopeDataBridge.TestProject/EuroScopeDataBridge.TestProject.csproj -c Release --nologo
