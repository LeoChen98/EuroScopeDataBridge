name: Build Test Project

on:
  push:
    paths-ignore:
      # Documentation/site-only changes do not need a test-client rebuild.
      - 'docs/**'
      - 'page/**'
      - '**/*.md'
      - 'AGENTS.md'

jobs:
  build:
    name: Build EuroScopeDataBridge.TestProject (WPF)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build tests/EuroScopeDataBridge.TestProject/EuroScopeDataBridge.TestProject.csproj -c Release --nologo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EuroScopeDataBridge.TestProject-Release
          # 测试工程完整构建输出
          path: tests/EuroScopeDataBridge.TestProject/bin/Release
