name: Release

on:
  push:
    tags:
      - 'release/*'

jobs:
  release:
    name: Build and Publish Draft Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 根据触发 tag（release/<major>.<minor>.<patch>）自动改写 src/Constants.h 中的版本号，
      # 使 release build 产物携带与 tag 一致的版本信息。仅改版本相关行，其余内容保持不变。
      - name: Bump plugin version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^release/', '' -replace '^v', ''
          $parts = $version.Split('.')
          if ($parts.Count -lt 3) {
            throw "Cannot parse version from tag '$tag' (expected release/<major>.<minor>.<patch>)"
          }
          $major = $parts[0]
          $minor = $parts[1]
          $patch = $parts[2]
          $path = 'src/Constants.h'
          $content = [System.IO.File]::ReadAllText($path)
          $content = [regex]::Replace($content, '(PLUGIN_VERSION\s+")[^"]*(")', "`${1}$version`${2}")
          $content = [regex]::Replace($content, '(PLUGIN_VERSION_MAJOR\s+)\d+', "`${1}$major")
          $content = [regex]::Replace($content, '(PLUGIN_VERSION_MINOR\s+)\d+', "`${1}$minor")
          $content = [regex]::Replace($content, '(PLUGIN_VERSION_PATCH\s+)\d+', "`${1}$patch")
          [System.IO.File]::WriteAllText($path, $content, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Bumped PLUGIN_VERSION to $version ($major.$minor.$patch) in $path"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          # 按 vcpkg.json 安装 asio/nlohmann-json 到仓库根目录 vcpkg_installed（vcxproj 的 include 路径依赖它）
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install --triplet x86-windows

      - name: Build EuroScopeDataBridge (Release, Win32)
        run: msbuild EuroScopeDataBridge.vcxproj -p:Configuration=Release -p:Platform=Win32 -p:SolutionDir="${{ github.workspace }}\" -m

      - name: Publish Draft Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          # 只附加主工程输出（dll/lib/exp/pdb），排除 obj 中间目录；不包含测试工程产物
          artifacts: 'Release/*,!Release/obj'
